<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Action Tailor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

  <!-- Header -->
  <header class="p-6">
    <a href="/" class="inline-flex items-center gap-2.5 text-slate-400 hover:text-white transition-colors text-sm font-semibold">
      <span>←</span> Back to Home
    </a>
  </header>

  <!-- Sign In Card -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl shadow-emerald-950/20">
      
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 text-white text-2xl font-bold shadow-lg shadow-emerald-900/30 mb-4">
          ✂️
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Welcome Back</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1.5">Sign in to your Action Tailor account / لاگ ان کریں</p>
      </div>

      <form id="signinForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            Email or WhatsApp Phone
          </label>
          <input
            type="text"
            id="identifier"
            placeholder="03001234567 or email@example.com"
            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm transition-colors"
            required
          >
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">
              Password
            </label>
            <a href="/recover-pass" class="text-xs text-emerald-400 hover:text-emerald-300 transition-colors">
              Forgot password?
            </a>
          </div>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm transition-colors"
            required
          >
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-emerald-600 focus:ring-emerald-500">
          <label for="rememberMe" class="text-xs text-slate-400 cursor-pointer">Remember this device</label>
        </div>

        <button
          type="submit"
          class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-900/40 transition-all text-sm mt-2"
        >
          Sign In / لاگ ان کریں
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
        Don't have an account? 
        <a href="/signup" class="text-emerald-400 hover:text-emerald-300 font-bold ml-1 transition-colors">
          Create an Account
        </a>
      </div>
    </div>
  </main>

  <footer class="p-6 text-center text-xs text-slate-600">
    &copy; 2026 Action Tailor. All rights reserved.
  </footer>

</body>
</html>

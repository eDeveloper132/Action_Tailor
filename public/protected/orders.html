<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management - Action Tailor / آرڈرز</title>

  <!-- Tailwind CSS CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>

  <!-- Centralized & View-Specific Custom CSS -->
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">
  <!-- Dynamic Mount for Navigation Bar UI Component -->
  <div id="navbarMount" class="no-print"></div>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 no-print">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
          Stitching Orders / سلائی آرڈرز
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">
          Complete operational queue, status transitions, and customer receipts
        </p>
      </div>
      <div>
        <a
          href="/orders/new"
          class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs sm:text-sm font-semibold shadow-lg shadow-brand-600/25 transition-all"
        >
          <span>✂</span>
          <span>Book New Suit / نیا سوٹ بک کریں</span>
        </a>
      </div>
    </div>

    <!-- Filter & Search Bar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 p-4 rounded-2xl bg-slate-900/60 border border-slate-800 my-6">
      <div class="relative flex-1">
        <input
          type="text"
          id="orderSearchInput"
          placeholder="Search by Order #, Customer Name, or WhatsApp phone..."
          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500"
        >
      </div>
      <div class="flex items-center gap-2">
        <select
          id="statusFilterSelect"
          class="px-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-brand-500"
        >
          <option value="">All Statuses / تمام حالتیں</option>
          <option value="pending">Pending / زیرِ التوا</option>
          <option value="cutting">Cutting / کٹائی</option>
          <option value="stitching">Stitching / سلائی</option>
          <option value="ready">Ready / تیار ہے</option>
          <option value="delivered">Delivered / دیا گیا</option>
        </select>
        <button id="btnRefreshOrders" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700" title="Refresh">
          🔄
        </button>
      </div>
    </div>

    <!-- Orders Cards List -->
    <div id="ordersContainer" class="space-y-3">
      <div class="text-center py-12 text-slate-500 text-sm">
        Loading orders...
      </div>
    </div>
  </main>

  <!-- Quick Payment Modal -->
  <div id="modalPayment" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span>💵</span> Receive Payment / رقم وصولی
        </h2>
        <button id="closePayModal" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <form id="formPay" class="space-y-3 text-xs sm:text-sm">
        <input type="hidden" id="payOrderId">
        <div>
          <div class="text-xs text-slate-400 mb-1">Order #:</div>
          <div id="payOrderNum" class="font-mono font-bold text-brand-400 text-sm">--</div>
        </div>

        <div>
          <div class="text-xs text-slate-400 mb-1">Remaining Balance:</div>
          <div id="payRemBalance" class="font-bold text-rose-400 text-base">0 PKR</div>
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1">Amount to Pay (PKR) <span class="text-rose-400">*</span></label>
          <input type="number" id="payAmountInput" min="1" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none" required>
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1">Payment Method</label>
          <select id="payMethodSelect" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white">
            <option value="cash">Cash / نقد</option>
            <option value="jazzcash">JazzCash / جاز کیش</option>
            <option value="easypaisa">EasyPaisa / ایزی پیسہ</option>
            <option value="bank_transfer">Bank Transfer / بینک</option>
          </select>
        </div>

        <div class="pt-3 flex justify-end gap-2 border-t border-slate-800">
          <button type="button" id="btnCancelPay" class="px-3.5 py-1.5 rounded-xl border border-slate-700 text-slate-300">
            Cancel
          </button>
          <button type="submit" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold text-white">
            Confirm Payment
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Printable Slip Container -->
  <div id="printableSlipArea" class="hidden print:block font-mono text-black bg-white p-6 max-w-xl mx-auto border border-dashed border-slate-300">
    <div id="printSlipContent"></div>
  </div>

  <!-- Centralized Global JS & External View TypeScript Controller -->
  <script src="/global.js"></script>
  <script type="module" src="/js/orders.js"></script>
</body>
</html>

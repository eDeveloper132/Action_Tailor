<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Action Tailor (Protected)</title>

  <!-- Tailwind CSS CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>

  <!-- Centralized & View-Specific Custom CSS -->
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">
  <!-- Dynamic Mount for Navigation Bar UI Component -->
  <div id="navbarMount"></div>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Header Section -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 id="userGreeting" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
          Protected Dashboard
        </h1>
        <p id="userSub" class="text-sm text-slate-400 mt-1">
          Welcome to your secure Action Tailor workspace.
        </p>
      </div>
      <div>
        <button
          id="systemInfoBtn"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold border border-slate-700 transition-all shadow-sm"
        >
          <span>ℹ</span> System Details
        </button>
      </div>
    </div>

    <!-- Reactive Stat Cards Grid (Populated by TypeScript Component) -->
    <div id="statCardsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 my-8"></div>

    <!-- Live Telemetry Monitor Card -->
    <section class="card rounded-2xl p-6 bg-slate-900/60 border border-slate-800 shadow-xl">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-indicator"></span>
          <h2 class="text-lg font-bold text-white">Live Health Telemetry</h2>
        </div>
        <span class="text-xs text-slate-500 font-mono">Auto-polling (5s)</span>
      </div>
      <pre id="telemetryData" class="dashboard-telemetry-container p-4 rounded-xl text-cyan-300 text-xs sm:text-sm overflow-x-auto shadow-inner leading-relaxed">Loading telemetry...</pre>
    </section>
  </main>

  <!-- Centralized Global JS & External View TypeScript Controller -->
  <script src="/global.js"></script>
  <script type="module" src="/js/dashboard.ts"></script>
</body>
</html>

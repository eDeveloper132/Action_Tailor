<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Action Tailor (Protected)</title>
  <link rel="stylesheet" href="/global.css">
  <style>
    .navbar {
      background-color: var(--surface-color);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand span {
      color: var(--primary-color);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .badge {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .dashboard-header {
      margin-bottom: 2rem;
    }
    .dashboard-header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .dashboard-header p {
      color: var(--text-secondary);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card h3 {
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .stat-card .value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div id="navbarMount"></div>

  <div class="container">
    <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">Protected Dashboard</h1>
        <p style="color: var(--text-secondary);">Welcome to your secure Action Tailor workspace.</p>
      </div>
      <div>
        <button id="systemInfoBtn" class="btn" style="background-color: var(--surface-color); border: 1px solid var(--border-color); color: #cbd5e1;">
          View System Modal
        </button>
      </div>
    </div>

    <!-- UI Components Grid Container -->
    <div id="statCardsGrid" class="grid" style="margin-top: 2rem;"></div>

    <div class="card" style="margin-top: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="font-size: 1.25rem; margin: 0;">Live Health Telemetry</h2>
        <span style="font-size: 0.75rem; color: #64748b;">Auto-refreshing every 5s</span>
      </div>
      <pre id="telemetryData" style="background: #090d16; padding: 1rem; border-radius: 0.5rem; color: #a5f3fc; overflow-x: auto; font-size: 0.875rem;">Loading telemetry...</pre>
    </div>
  </div>

  <script src="/global.js"></script>
  <script type="module">
    import {
      renderNavbar,
      createStatCard,
      updateStatCard,
      showToast,
      showModal,
    } from '/ui_components/index.ts';

    // 1. Mount Navigation Bar Component
    renderNavbar('navbarMount', {
      brandName: 'Action Tailor',
      logoIcon: '⚡',
      activeLink: 'dashboard',
      showAuthButton: true,
    });

    // 2. Render Stat Cards Components
    const grid = document.getElementById('statCardsGrid');

    const cardStatus = createStatCard({
      id: 'cardStatus',
      title: 'Server Status',
      value: 'CHECKING...',
      subtitle: 'Monitoring HTTP & WebSocket',
      color: 'primary',
    });

    const cardUptime = createStatCard({
      id: 'cardUptime',
      title: 'System Uptime',
      value: '0s',
      subtitle: 'Continuous uptime',
      color: 'success',
    });

    const cardEnv = createStatCard({
      id: 'cardEnv',
      title: 'Architecture',
      value: 'Full-Stack TS',
      subtitle: 'Express 5 • JWT • Sockets',
      color: 'primary',
    });

    grid.appendChild(cardStatus);
    grid.appendChild(cardUptime);
    grid.appendChild(cardEnv);

    // 3. Telemetry Update Function
    async function loadTelemetry() {
      try {
        const data = await window.ActionTailor.apiFetch('/health');
        updateStatCard('cardStatus', data.status.toUpperCase(), 'All systems operational');
        updateStatCard('cardUptime', Math.floor(data.uptime) + 's', 'Active server process');
        document.getElementById('telemetryData').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        updateStatCard('cardStatus', 'OFFLINE', 'Connection error');
        document.getElementById('telemetryData').textContent = 'Error fetching telemetry: ' + err.message;
        showToast('Failed to refresh system telemetry', 'error', { title: 'Network Notice' });
      }
    }

    // 4. Authenticated User Profile
    async function loadUser() {
      try {
        const res = await window.ActionTailor.apiFetch('/api/auth/me');
        if (res.data) {
          const user = res.data;
          document.querySelector('.dashboard-header h1').textContent = `Welcome, ${user.name || user.email}!`;
          document.querySelector('.dashboard-header p').textContent = `Authenticated as ${user.email} (Role: ${user.role || 'user'})`;
          showToast(`Signed in as ${user.email}`, 'info', { title: 'Session Active', duration: 3000 });
        }
      } catch (_err) {
        // Handled by auth middleware
      }
    }

    // 5. System Modal Trigger
    document.getElementById('systemInfoBtn').addEventListener('click', () => {
      showModal({
        title: 'Action Tailor System Details',
        content: `
          <p style="margin-bottom: 0.75rem;">This dashboard is powered by custom modular TypeScript UI components:</p>
          <ul style="padding-left: 1.25rem; line-height: 1.6; color: #94a3b8; font-size: 0.875rem;">
            <li><strong>Navbar:</strong> Sticky, responsive, authentication-aware</li>
            <li><strong>StatCard:</strong> Live reactive metrics with color presets</li>
            <li><strong>Toast:</strong> Floating notification queue with auto-dismiss</li>
            <li><strong>Modal:</strong> Accessible dialog overlays with animations</li>
          </ul>
        `,
        confirmText: 'Awesome!',
        cancelText: 'Close',
        onConfirm: () => {
          showToast('Modal confirmed!', 'success');
        },
      });
    });

    loadUser();
    loadTelemetry();
    setInterval(loadTelemetry, 5000);
  </script>
</body>
</html>

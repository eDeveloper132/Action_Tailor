<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Measurement Profiles - Action Tailor / ناپ کا ریکارڈ</title>

  <!-- Tailwind CSS CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>

  <!-- Centralized & View-Specific Custom CSS -->
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">
  <div id="navbarMount" class="no-print"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 no-print">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
          Measurement Profiles / ناپ کا کھاتہ
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">
          Record, customize and reuse bilingual Pakistani tailoring measurement profiles
        </p>
      </div>
      <div>
        <button
          id="btnOpenNewProfileModal"
          class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs sm:text-sm font-semibold shadow-lg shadow-brand-600/25 transition-all"
        >
          <span>📐</span>
          <span>Record New Profile / نیا ناپ لکھیں</span>
        </button>
      </div>
    </div>

    <!-- Customer Filter -->
    <div class="my-6 max-w-md">
      <label class="block text-xs font-semibold text-slate-400 mb-1">Filter by Customer / گاہک منتخب کریں</label>
      <select id="measCustomerFilter" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-brand-500">
        <option value="">All Customers / تمام گاہک</option>
      </select>
    </div>

    <!-- Measurement Profiles Grid -->
    <div id="profilesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="text-slate-500 text-sm py-8">Loading measurement profiles...</div>
    </div>
  </main>

  <!-- New Measurement Profile Modal -->
  <div id="modalNewProfile" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span>📐</span> Record Measurement Profile / ناپ درج کریں
        </h2>
        <button id="closeProfileModal" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <form id="formNewProfile" class="space-y-4 text-xs sm:text-sm">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-300 mb-1">Customer / گاہک <span class="text-rose-400">*</span></label>
            <select id="profileCustomerSelect" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white" required>
              <option value="">Select customer / گاہک منتخب کریں</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-300 mb-1">Profile Title / عنوان (e.g. Eid 2026, Regular) <span class="text-rose-400">*</span></label>
            <input type="text" id="profileTitle" placeholder="Personal, Eid Fit, Father" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white" required>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-300 mb-1">Garment Category / لباس</label>
            <select id="profileGarment" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white">
              <option value="shalwaar_qameez">Shalwaar Qameez / شلوار قمیض</option>
              <option value="kurta_pajama">Kurta Pajama / کرتہ پاجامہ</option>
              <option value="waistcoat">Waistcoat / واسکٹ</option>
              <option value="trouser_shirt">Shirt & Trouser / پینٹ شرٹ</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-slate-300 mb-1">Unit / پیمائش کی اکائی</label>
            <select id="profileUnit" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white">
              <option value="inches">Inches / انچ (Standard)</option>
              <option value="cm">Centimeters / سینٹی میٹر</option>
            </select>
          </div>
        </div>

        <!-- Upper Body / Qameez Form -->
        <div class="p-4 rounded-xl bg-slate-950/70 border border-slate-800 space-y-3">
          <div class="font-bold text-brand-400 text-xs uppercase tracking-wider">Upper / Qameez / قمیض کے ناپ</div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Length / لمبائی</label>
              <input type="number" step="0.25" id="m_q_length" placeholder="40" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Shoulder / تیرا</label>
              <input type="number" step="0.25" id="m_q_shoulder" placeholder="18" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Chest / چھاتی</label>
              <input type="number" step="0.25" id="m_q_chest" placeholder="22" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Waist / کمر</label>
              <input type="number" step="0.25" id="m_q_waist" placeholder="20.5" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Sleeve / بازو</label>
              <input type="number" step="0.25" id="m_q_sleeve" placeholder="24" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Collar / کالر</label>
              <input type="number" step="0.25" id="m_q_collar" placeholder="15.5" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Cuff / کف</label>
              <input type="number" step="0.25" id="m_q_cuff" placeholder="9" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Ghera / دامن</label>
              <input type="number" step="0.25" id="m_q_ghera" placeholder="23.5" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
          </div>
        </div>

        <!-- Lower Body / Shalwaar Form -->
        <div class="p-4 rounded-xl bg-slate-950/70 border border-slate-800 space-y-3">
          <div class="font-bold text-brand-400 text-xs uppercase tracking-wider">Lower / Shalwaar / شلوار کے ناپ</div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Length / شلوار لمبائی</label>
              <input type="number" step="0.25" id="m_s_length" placeholder="38" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Paincha / پائینچہ</label>
              <input type="number" step="0.25" id="m_s_paincha" placeholder="8.5" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Aasan / آسن</label>
              <input type="number" step="0.25" id="m_s_aasan" placeholder="16" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
            <div>
              <label class="block text-slate-400 text-[11px] mb-1">Waist / گھیر یا نیفہ</label>
              <input type="number" step="0.25" id="m_s_waist" placeholder="24" class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-white">
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="profileIsDefault" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-brand-600">
          <label for="profileIsDefault" class="text-xs text-slate-300">Set as default measurement profile / بنیادی ناپ بنائیں</label>
        </div>

        <div class="pt-3 flex justify-end gap-2.5 border-t border-slate-800">
          <button type="button" id="btnCancelProfile" class="px-4 py-2 rounded-xl border border-slate-700 text-slate-300">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 font-semibold text-white">Save Profile / ناپ محفوظ کریں</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/global.js"></script>
  <script type="module" src="/js/measurements.js"></script>
</body>
</html>

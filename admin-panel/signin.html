<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / لاگ ان کریں - Action Tailor</title>
  
  <!-- Tailwind CSS CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tailwind-config.js"></script>

  <!-- Centralized & View-Specific Custom CSS -->
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/auth.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">
  <div class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md auth-card rounded-2xl p-8 sm:p-10 border border-slate-200 bg-white shadow-sm">
      
      <!-- Brand & Title Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-50 text-emerald-700 mb-4 border border-emerald-200 shadow-2xs">
          <span class="text-2xl font-bold">✂</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Master Tailor Desk / ماسٹر ٹیلر ڈیسک</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1.5">Shop Staff & Tailoring Operations Login / دکان کا عملہ لاگ ان</p>
      </div>

      <!-- Authentication Form -->
      <form id="signinForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2" for="email">
            Email Address / ای میل پتہ
          </label>
          <input
            type="email"
            id="email"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 auth-input focus:outline-none focus:border-emerald-600 focus:bg-white text-sm"
            placeholder="admin@actiontailor.pk"
            required
            autocomplete="email"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-2" for="password">
            Password / پاس ورڈ
          </label>
          <input
            type="password"
            id="password"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 auth-input focus:outline-none focus:border-emerald-600 focus:bg-white text-sm"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="flex items-center justify-between text-xs sm:text-sm">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600 hover:text-slate-800 select-none">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-white border-slate-300 text-emerald-600 focus:ring-emerald-500">
            <span>Remember Me / یاد رکھیں</span>
          </label>
          <span class="text-xs text-slate-400">Restricted Access / مخصوص رسائی</span>
        </div>

        <button
          type="submit"
          class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-xs transition-all flex items-center justify-center text-sm"
        >
          Login / لاگ ان کریں
        </button>
      </form>

      <!-- Customer Redirect Notice -->
      <div class="text-center mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500">
        Looking for your suit status or measurements? / کیا آپ سوٹ کا سٹیٹس یا ناپ دیکھنا چاہتے ہیں؟
        <br>
        <a href="http://localhost:3002" class="text-emerald-700 hover:text-emerald-800 font-semibold mt-1.5 inline-block transition-colors">
          Go to Customer Portal / کسٹمر پورٹل پر جائیں ➔
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/signin.ts"></script>
</body>
</html>

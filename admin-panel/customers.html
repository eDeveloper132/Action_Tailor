<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers Directory - Action Tailor / گاہکوں کا ریکارڈ</title>

  <!-- Tailwind CSS CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tailwind-config.js"></script>

  <!-- Centralized & View-Specific Custom CSS -->
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/dashboard.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">
  <!-- Dynamic Mount for Admin Navigation Bar -->
  <div id="navbarMount" class="no-print"></div>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 no-print space-y-6">
    <!-- Header -->
    <div class="tailor-card p-6 rounded-2xl bg-white border border-slate-200 shadow-xs flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
          Customer Directory / گاہکوں کا کھاتہ
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">
          Search by WhatsApp/phone, view past stitching history and recorded measurements
        </p>
      </div>
      <div>
        <button
          id="btnOpenAddCustomerModal"
          class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold shadow-xs transition-all"
        >
          <span>👤</span>
          <span>Add New Customer / نیا گاہک درج کریں</span>
        </button>
      </div>
    </div>

    <!-- Search Input -->
    <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-xs">
      <input
        type="text"
        id="customerSearchInput"
        placeholder="Quick search by Name, WhatsApp phone, or City / نام یا فون سے تلاش کریں..."
        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-emerald-600 focus:bg-white"
      >
    </div>

    <!-- Customers Grid Container -->
    <div id="customersGridContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-12 text-slate-400 text-sm bg-white rounded-2xl border border-dashed border-slate-200">
        Loading customers directory...
      </div>
    </div>
  </main>

  <!-- Add New Customer Modal -->
  <div id="modalAddCustomer" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-3 sm:p-4 hidden">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 shadow-2xl text-slate-900">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <span>👤</span> Register Customer / نیا گاہک
        </h2>
        <button id="closeAddCustModal" class="text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
      </div>

      <form id="formAddCustomer" class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Full Name / گاہک کا نام <span class="text-rose-500">*</span></label>
          <input type="text" id="newCustName" placeholder="e.g. Tariq Mehmood" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 focus:bg-white focus:border-emerald-600" required>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Phone / WhatsApp Number <span class="text-rose-500">*</span></label>
          <input type="tel" id="newCustPhone" placeholder="03001234567" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 focus:bg-white focus:border-emerald-600" required>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">City / Address</label>
          <input type="text" id="newCustCity" placeholder="Lahore, Model Town" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 focus:bg-white focus:border-emerald-600">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Email (Optional)</label>
          <input type="email" id="newCustEmail" placeholder="customer@gmail.com" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 focus:bg-white focus:border-emerald-600">
        </div>

        <div class="pt-3 flex justify-end gap-2 border-t border-slate-100">
          <button type="button" id="btnCancelAddCust" class="px-3.5 py-1.5 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-50">
            Cancel
          </button>
          <button type="submit" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 font-semibold text-white">
            Register Customer
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/js/customers.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Sign In - Action Tailor / کسٹمر لاگ ان</title>
  
  <!-- Tailwind CSS CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tailwind-config.js"></script>

  <!-- Centralized & View-Specific Custom CSS -->
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/auth.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">
  <div class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md auth-card rounded-2xl p-8 sm:p-10">
      
      <!-- Brand & Title Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600/20 text-emerald-400 mb-4 border border-emerald-500/30">
          <span class="text-2xl font-bold">✂</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Customer Portal</h1>
        <p class="text-sm text-slate-400 mt-2">Sign in to track your suits & view measurements</p>
      </div>

      <!-- Authentication Form -->
      <form id="signinForm" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2" for="email">
            Email Address
          </label>
          <input
            type="email"
            id="email"
            class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 auth-input focus:outline-none text-sm"
            placeholder="tariq@gmail.com"
            required
            autocomplete="email"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2" for="password">
            Password
          </label>
          <input
            type="password"
            id="password"
            class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 auth-input focus:outline-none text-sm"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer text-slate-400 hover:text-slate-300 select-none">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-emerald-600 focus:ring-emerald-500 focus:ring-offset-slate-950">
            <span>Remember me</span>
          </label>
          <a href="#" class="text-emerald-400 hover:text-emerald-300 transition-colors font-medium text-xs">Need help?</a>
        </div>

        <button
          type="submit"
          class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/25 transition-all duration-200 flex items-center justify-center text-sm"
        >
          Sign In to Portal / لاگ ان
        </button>
      </form>

      <!-- Switch to Sign Up -->
      <div class="text-center mt-8 pt-6 border-t border-slate-800 text-sm text-slate-400">
        Don't have an account?
        <a href="/signup.html" class="text-emerald-400 hover:text-emerald-300 font-semibold ml-1 transition-colors">
          Sign up / نیا اکاؤنٹ بنائیں
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/signin.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Action Tailor</title>

  <!-- Tailwind CSS CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tailwind-config.js"></script>

  <!-- Centralized & View-Specific Custom CSS -->
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/auth.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">
  <div class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md auth-card rounded-2xl p-8 sm:p-10">

      <!-- Brand & Title Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600/20 text-emerald-400 mb-4 border border-emerald-500/30">
          <span class="text-2xl font-bold">✂</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Create Account</h1>
        <p class="text-sm text-slate-400 mt-2">Get started with Action Tailor today</p>
      </div>

      <!-- Registration Form -->
      <form id="signupForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2" for="fullname">
            Full Name
          </label>
          <input
            type="text"
            id="fullname"
            class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 auth-input focus:outline-none text-sm"
            placeholder="John Doe"
            required
            autocomplete="name"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2" for="email">
            Email Address
          </label>
          <input
            type="email"
            id="email"
            class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 auth-input focus:outline-none text-sm"
            placeholder="name@company.com"
            required
            autocomplete="email"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2" for="password">
            Password
          </label>
          <input
            type="password"
            id="password"
            class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 auth-input focus:outline-none text-sm"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          >
          
          <!-- Real-time Strength Meter & Label -->
          <div class="flex items-center justify-between text-xs mt-2.5 mb-1.5">
            <span class="text-slate-400">Password strength:</span>
            <span id="strengthLabel" class="font-semibold text-slate-500">Not entered</span>
          </div>
          <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
            <div id="strengthBar" class="h-full w-0 transition-all duration-300 rounded-full bg-slate-700"></div>
          </div>

          <!-- Real-time Requirement Checklist Chips -->
          <div id="passwordRequirements" class="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-2">
            <div id="ruleLetter" class="rule-item invalid p-2 rounded-lg bg-slate-900/60 border border-slate-800">
              <span class="rule-icon w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[9px] font-bold">○</span>
              <span>1+ Letter</span>
            </div>
            <div id="ruleNumber" class="rule-item invalid p-2 rounded-lg bg-slate-900/60 border border-slate-800">
              <span class="rule-icon w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[9px] font-bold">○</span>
              <span>1+ Number</span>
            </div>
            <div id="ruleLength" class="rule-item invalid p-2 rounded-lg bg-slate-900/60 border border-slate-800">
              <span class="rule-icon w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[9px] font-bold">○</span>
              <span id="ruleLengthText">8+ Chars</span>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2" for="confirmPassword">
            Confirm Password
          </label>
          <input
            type="password"
            id="confirmPassword"
            class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 auth-input focus:outline-none text-sm"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          >
          <div id="matchIndicator" class="mt-2 text-xs flex items-center gap-1.5 transition-colors duration-200 text-slate-500">
            <span id="matchIcon" class="font-bold">○</span>
            <span id="matchText">Confirm password to match</span>
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/25 transition-all duration-200 flex items-center justify-center text-sm mt-2"
        >
          Create Account
        </button>
      </form>

      <!-- Switch to Sign In -->
      <div class="text-center mt-8 pt-6 border-t border-slate-800 text-sm text-slate-400">
        Already have an account?
        <a href="/signin.html" class="text-emerald-400 hover:text-emerald-300 font-semibold ml-1 transition-colors">
          Sign in / لاگ ان
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/signup.ts"></script>
</body>
</html>
